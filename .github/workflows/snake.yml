name: Generate Snake
on:
  schedule:
    # Refresh several times per day so new contributions appear sooner.
    - cron: "0 */6 * * *"
  workflow_dispatch:
  # Regenerate the snake after every push, regardless of branch.
  push:
    # The action publishes generated SVGs to this branch; ignore it to avoid a loop.
    branches-ignore:
      - output

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: SpandanRoy-08
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
